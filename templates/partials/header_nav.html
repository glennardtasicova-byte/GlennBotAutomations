    <!-- HEADER WITH 3-DASH SIDEBAR TOGGLE -->
    <header class="flex-none flex items-center justify-between gap-3 sm:gap-4 mb-2.5 sm:mb-3 w-full max-w-none mx-auto">
        <div class="flex items-center gap-3 sm:gap-3.5">
            <!-- 3-DASH TOGGLE AUXILIARY PANE BUTTON -->
            <button onclick="toggleLeftSidebar()" id="btn-toggle-sidebar" class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-slate-900/90 hover:bg-gb-cyan/20 border border-gb-cyan/50 text-gb-cyan flex items-center justify-center transition-all shadow-[0_0_12px_rgba(0,240,255,0.2)] shrink-0" title="Toggle Navigation Sidebar">
                <i class="fas fa-bars text-base sm:text-lg"></i>
            </button>
            <img src="Profile Picture.jfif" alt="GlennBot Logo" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl shadow-[0_0_15px_rgba(0,240,255,0.5)] border border-gb-cyan object-cover shrink-0" onerror="this.src='https://via.placeholder.com/80?text=GB'">
            <div class="text-left">
                <h1 class="text-base sm:text-xl md:text-2xl font-bold tracking-widest neon-text uppercase m-0 leading-tight">GlennBot Automations</h1>
                <p class="text-slate-400 mt-0.5 font-light tracking-wider text-[10px] sm:text-xs">Eliminate Manual Work • Scale With Automation</p>
            </div>
        </div>

        <!-- QUICK STATUS PILL ON RIGHT (INTERNAL API N8N + MANAGE API + CONNECTED ACCOUNTS + SETTINGS + ROLE/LOGOUT) -->
        <div class="flex items-center gap-2">
            <span id="header-auth-role-badge" class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-[10px] font-bold border border-slate-700 bg-slate-900/90 text-slate-300" title="Current Logged-In Access Level">
                <i class="fas fa-user-check text-gb-cyan"></i>
                <span id="header-auth-role-text">Client</span>
            </span>
            <button id="header-internal-api-btn" onclick="openInternalApiModal()" class="hidden sm:flex px-3 py-2 rounded-xl text-xs font-semibold border border-emerald-500/50 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 transition-all items-center gap-2" title="Administrator Only: Generate GlennBot Internal API Keys & Configure n8n Automation">
                <i class="fas fa-robot text-emerald-400"></i>
                <span>Internal API (n8n)</span>
            </button>
            <button onclick="openManageApiModal()" class="hidden sm:flex px-3 py-2 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-900/90 hover:border-gb-cyan/50 text-slate-200 hover:text-gb-cyan transition-all items-center gap-2">
                <i class="fas fa-sliders-h text-gb-cyan"></i>
                <span>Manage API</span>
            </button>
            <button onclick="openConnectAccountsModal('manage')" class="hidden sm:flex px-3.5 py-2 rounded-xl text-xs font-semibold border border-gb-cyan/50 bg-gb-cyan/10 hover:bg-gb-cyan/20 text-gb-cyan transition-all items-center gap-2 shadow-[0_0_12px_rgba(0,240,255,0.15)]">
                <i class="fas fa-plug"></i>
                <span>Connected Accounts</span>
                <span id="header-connected-badge" class="bg-gb-cyan text-slate-950 px-1.5 py-0.2 rounded-full text-[10px] font-bold">0</span>
            </button>
            <button onclick="openSettingsModal()" id="header-settings-btn" class="px-3 py-2 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-900/90 hover:border-gb-cyan hover:bg-gb-cyan/15 text-slate-200 hover:text-gb-cyan transition-all flex items-center gap-2 shadow-[0_0_10px_rgba(0,240,255,0.1)]" title="Customize Sound Effects (coin.mp3), Fade Animations & Background Launch Queue">
                <i class="fas fa-cog text-gb-cyan"></i>
                <span class="hidden sm:inline">Settings</span>
            </button>
            <button onclick="logoutGlennBotDashboard()" id="header-logout-btn" class="px-2.5 py-2 rounded-xl text-xs font-semibold border border-rose-500/40 bg-rose-950/40 hover:bg-rose-900/60 hover:border-rose-400 text-rose-300 hover:text-white transition-all flex items-center gap-1.5" title="Sign Out of Dashboard">
                <i class="fas fa-sign-out-alt"></i>
                <span class="hidden lg:inline">Logout</span>
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE WRAPPER: LEFT COLLAPSIBLE STACK MENU + RIGHT CONTENT PANE -->

        <!-- LEFT COLLAPSIBLE STACK MENU (AUXILIARY PANE) -->

            <div class="space-y-1.5">
                <div class="px-2.5 py-1.5 flex items-center justify-between border-b border-slate-800 mb-2">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Navigation Menu</span>
                    <button onclick="toggleLeftSidebar()" class="text-slate-400 hover:text-gb-cyan text-xs" title="Hide Sidebar">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>

                <button onclick="switchTab('scheduler')" id="tab-btn-scheduler" class="tab-btn active w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-plus-circle w-4 text-center"></i> Create Post</span>
                </button>

                <button onclick="switchTab('calendar')" id="tab-btn-calendar" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">

                <button onclick="switchTab('queue')" id="tab-btn-queue" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-table w-4 text-center"></i> Queue</span>
                    <span id="queue-badge" class="bg-gb-cyan/20 text-gb-cyan border border-gb-cyan/40 px-2 py-0.5 rounded-full text-[10px] font-bold">0</span>
                </button>

                <button onclick="switchTab('comments')" id="tab-btn-comments" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-comments w-4 text-center"></i> Comments</span>
                    <span class="flex items-center gap-1">
                        <span id="comments-unread-badge" class="hidden bg-rose-500 text-white border border-rose-300 shadow-[0_0_10px_rgba(244,63,94,0.8)] px-1.5 py-0.5 rounded-full text-[10px] font-bold animate-pulse" title="New Unread Comments">0</span>
                        <span id="comments-total-badge" class="bg-gb-cyan/20 text-gb-cyan border border-gb-cyan/40 px-2 py-0.5 rounded-full text-[10px] font-bold" title="Total Tracked Comments">0</span>
                    </span>
                </button>

                <button onclick="switchTab('messages')" id="tab-btn-messages" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-envelope w-4 text-center"></i> Messages</span>
                    <span class="flex items-center gap-1">
                        <span id="messages-unread-badge" class="hidden bg-rose-500 text-white border border-rose-300 shadow-[0_0_10px_rgba(244,63,94,0.8)] px-1.5 py-0.5 rounded-full text-[10px] font-bold animate-pulse" title="Unread Messages">0</span>
                        <span id="messages-total-badge" class="bg-gb-cyan/20 text-gb-cyan border border-gb-cyan/40 px-2 py-0.5 rounded-full text-[10px] font-bold" title="Loaded Conversations">0</span>
                    </span>
                </button>

                <button onclick="switchTab('email')" id="tab-btn-email" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-at w-4 text-center text-gb-cyan"></i> Email</span>
                    <span class="flex items-center gap-1">
                        <span id="email-unread-badge" class="hidden bg-rose-500 text-white border border-rose-300 shadow-[0_0_10px_rgba(244,63,94,0.8)] px-1.5 py-0.5 rounded-full text-[10px] font-bold animate-pulse" title="Unread Emails in Selected Account">0</span>
                        <span id="email-accounts-badge" class="bg-gb-cyan/20 text-gb-cyan border border-gb-cyan/40 px-2 py-0.5 rounded-full text-[10px] font-bold" title="Connected Email Accounts">0</span>
                    </span>
                </button>

                <button onclick="switchTab('contacts')" id="tab-btn-contacts" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-address-book w-4 text-center text-emerald-400"></i> Contacts</span>
                    <span id="contacts-total-badge" class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded-full text-[10px] font-bold" title="Total Saved CRM Contacts">0</span>
                </button>

                <button onclick="switchTab('analytics')" id="tab-btn-analytics" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-chart-line w-4 text-center"></i> Analytics</span>
                    <span id="analytics-pages-badge" class="bg-gb-cyan/20 text-gb-cyan border border-gb-cyan/40 px-2 py-0.5 rounded-full text-[10px] font-bold" title="Connected Social Media Pages Tracked">0</span>
                </button>

                <button onclick="switchTab('files')" id="tab-btn-files" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-folder-open w-4 text-center text-amber-400"></i> Files</span>

                <button onclick="switchTab('spreadsheet')" id="tab-btn-spreadsheet" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-file-excel w-4 text-center text-emerald-400"></i> Spread Sheet</span>
                    <span id="spreadsheet-total-badge" class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded-full text-[10px] font-bold" title="Saved .xlsx Spreadsheets in Cloudinary">1</span>

                <button onclick="switchTab('automations')" id="tab-btn-automations" class="tab-btn w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-transparent text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center justify-between">
                    <span class="flex items-center gap-2.5"><i class="fas fa-project-diagram w-4 text-center text-purple-400"></i> Automations</span>
                    <span id="automations-canvas-lock-badge" class="bg-slate-800 text-slate-400 border border-slate-700 px-2 py-0.5 rounded-full text-[10px] font-bold" title="Blank Canvas — Upload or Ask AI for a .JSON file to unlock editing">LOCKED</span>
                </button>
            </div>

            <div class="pt-2 border-t border-slate-800 space-y-2">
                <button onclick="openSettingsModal()" class="w-full px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-900/80 hover:border-gb-cyan/50 text-slate-300 hover:text-gb-cyan transition-all flex items-center justify-between" title="Customize Sound Effects, Fade Animations & Launch Automation">
                    <span class="flex items-center gap-2"><i class="fas fa-cog text-gb-cyan"></i> Settings</span>
                    <i class="fas fa-chevron-right text-[10px]"></i>
                </button>
                <button id="sidebar-internal-api-btn" onclick="openInternalApiModal()" class="w-full px-3.5 py-2 rounded-xl text-xs font-semibold border border-emerald-500/40 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 transition-all flex items-center justify-between" title="Administrator Only: Generate GlennBot Internal API Keys & Configure n8n Automation">
                    <span class="flex items-center gap-2"><i class="fas fa-robot text-emerald-400"></i> Internal API (n8n)</span>
                    <i class="fas fa-chevron-right text-[10px]"></i>

                <button onclick="openManageApiModal()" class="w-full px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-900/80 hover:border-gb-cyan/50 text-slate-300 hover:text-gb-cyan transition-all flex items-center justify-between" title="Manage External API Keys & Buffer Queue">
                    <span class="flex items-center gap-2"><i class="fas fa-sliders-h text-gb-cyan"></i> Manage API</span>
                    <i class="fas fa-chevron-right text-[10px]"></i>

                <button onclick="openConnectAccountsModal('manage')" class="w-full px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-gb-cyan/50 bg-gb-cyan/10 hover:bg-gb-cyan/20 text-gb-cyan transition-all flex items-center justify-between" title="Connect or Remove Facebook, Instagram & TikTok Accounts">

                    <span id="nav-connected-badge" class="bg-gb-cyan text-slate-950 px-2 py-0.5 rounded-full text-[10px] font-bold">0</span>

                    <i class="fas fa-chevron-right text-[10px]"></i>

        </aside>
