    <!-- ==================== TAB 3: QUEUE VIEW (TABULAR FORMAT) ==================== -->
    <div id="view-queue" class="hidden flex-1 lg:min-h-0 flex flex-col w-full max-w-none mx-auto pb-4 lg:pb-1">
        <div class="glass-panel rounded-2xl p-4 sm:p-5 flex flex-col lg:h-full lg:min-h-0">
            <div class="flex-none flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-700">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-white"><i class="fas fa-table text-gb-cyan mr-2"></i>Scheduled Posts Queue (Tabular View)</h2>
                    <p class="text-[11px] sm:text-xs text-slate-400">Chronological master table • Stored in Supabase PostgreSQL (30-Day Retention)</p>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <select id="queue-filter-status" onchange="renderQueue()" class="bg-slate-800 border border-slate-600 text-white text-xs rounded-lg px-3 py-1.5 focus:border-gb-cyan focus:outline-none cursor-pointer flex-1 sm:flex-none">
                        <option value="all">All Statuses</option>
                        <option value="processing">Processing Payload</option>
                        <option value="waiting">Waiting / Scheduled</option>
                        <option value="published">Published</option>
                        <option value="failed">Failed</option>
                    </select>
                    <button onclick="fetchScheduledPosts()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-gb-cyan px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 shrink-0">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <div id="queue-container" class="flex-1 lg:min-h-0 overflow-auto rounded-xl border border-slate-700/80 bg-slate-900/50"></div>
        </div>
    </div>
