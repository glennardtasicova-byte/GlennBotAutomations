 <!-- ==================== VIEW 8: CLIENT CONTACTS & LEAD CRM DATABASE ==================== -->
 <div id="view-contacts" class="hidden flex-1 w-full lg:h-full flex flex-col min-h-0">
  <div class="glass-panel rounded-2xl p-3 sm:p-5 flex-1 flex flex-col min-h-0 overflow-y-auto">
   <!-- Top CRM Header & Action Toolbar -->
   <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-3 pb-3.5 mb-3.5 border-b border-slate-700/80 shrink-0">
    <div class="flex items-center gap-3">
     <div class="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-400/50 flex items-center justify-center text-emerald-400 shrink-0 shadow-[0_0_15px_rgba(16,185,129,0.25)]">
      <i class="fas fa-address-book text-lg"></i>
     </div>
     <div>
      <div class="flex items-center gap-2 flex-wrap">
       <h2 class="text-sm sm:text-base md:text-lg font-bold tracking-wider uppercase text-white">Contacts &amp; Lead CRM Database</h2>
       <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/40 font-semibold flex items-center gap-1">
        <i class="fas fa-cloud-upload-alt text-[9px]"></i> Synced to DB + Cloudinary
       </span>
      </div>
      <p class="text-[11px] sm:text-xs text-slate-400">
       Manage leads captured from <strong>Messages</strong>, <strong>Comments</strong>, <strong>Email</strong>, or manual entry with smart name auto-detection.
      </p>
     </div>
    </div>
    <!-- Search + Filter + Create Contact Buttons -->
    <div class="flex flex-wrap items-center gap-2">
     <!-- Real-Time Search Box -->
     <div class="relative flex-1 sm:flex-none sm:w-64">
      <i class="fas fa-search text-slate-500 text-xs absolute left-3 top-1/2 -translate-y-1/2"></i>
      <input type="text" id="crm-contacts-search" oninput="renderCrmContactsTable()" placeholder="Search name, phone, email, @username..." class="w-full bg-slate-900 border border-slate-700 focus:border-gb-cyan rounded-xl pl-8 pr-3 py-2 text-xs text-white focus:outline-none">
     </div>
     <!-- Source Platform Filter -->
     <select id="crm-filter-platform" onchange="renderCrmContactsTable()" class="bg-slate-900 border border-slate-700 focus:border-gb-cyan text-white text-xs rounded-xl px-2.5 py-2 focus:outline-none cursor-pointer [color-scheme:dark]">
      <option value="all" class="bg-slate-900 text-white">All Platforms</option>
      <option value="sms" class="bg-slate-900 text-white">SMS (TextBee SIM 2)</option>
      <option value="whatsapp" class="bg-slate-900 text-white">WhatsApp</option>
      <option value="telegram" class="bg-slate-900 text-white">Telegram</option>
      <option value="facebook" class="bg-slate-900 text-white">Facebook</option>
      <option value="instagram" class="bg-slate-900 text-white">Instagram</option>
      <option value="tiktok" class="bg-slate-900 text-white">TikTok</option>
      <option value="youtube" class="bg-slate-900 text-white">YouTube</option>
      <option value="google_contacts" class="bg-slate-900 text-white">Google Contacts</option>
      <option value="apollo" class="bg-slate-900 text-white">Apollo CSV</option>
      <option value="gmail" class="bg-slate-900 text-white">Gmail / Email</option>
      <option value="manual" class="bg-slate-900 text-white">Manual Entry</option>
     </select>
     <!-- Category / Status Filter -->
     <select id="crm-filter-category" onchange="renderCrmContactsTable()" class="bg-slate-900 border border-slate-700 focus:border-gb-cyan text-white text-xs rounded-xl px-2.5 py-2 focus:outline-none cursor-pointer [color-scheme:dark]">
      <option value="all" class="bg-slate-900 text-white">All Categories</option>
      <option value="New Lead" class="bg-slate-900 text-white">New Lead</option>
      <option value="Hot Prospect" class="bg-slate-900 text-white">Hot Prospect</option>
      <option value="Active Client" class="bg-slate-900 text-white">Active Client</option>
      <option value="VIP" class="bg-slate-900 text-white">VIP</option>
      <option value="Inquirer" class="bg-slate-900 text-white">Inquirer</option>
      <option value="Follow-Up" class="bg-slate-900 text-white">Follow-Up</option>
      <option value="Partner" class="bg-slate-900 text-white">Partner</option>
     </select>
     <!-- Quick Link WhatsApp / Telegram Button -->
     <button type="button" onclick="openConnectAccountsModal('whatsapp')" class="px-3 py-2 rounded-xl bg-[#25D366]/15 hover:bg-[#25D366]/25 border border-[#25D366]/50 text-[#25D366] text-xs font-semibold flex items-center gap-1.5 transition-all" title="Connect WhatsApp or Telegram">
      <i class="fab fa-whatsapp"></i>
      <i class="fab fa-telegram-plane text-[#229ED9]"></i>
      <span class="hidden sm:inline">Link WA / TG</span>
     </button>
     <!-- Unified Import Contacts Dropdown Button (Submenu: Import Google Contacts & via Apollo CSV) -->
     <div class="relative inline-block" id="crm-import-contacts-dropdown-wrap">
      <button type="button" id="btn-import-contacts-menu" onclick="toggleImportContactsSubmenu(event)" class="px-3.5 py-2 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-400/60 text-amber-200 hover:text-white text-xs font-extrabold flex items-center gap-1.5 transition-all shadow-[0_0_14px_rgba(245,158,11,0.22)]" title="Import Contacts into CRM (Google Contacts or Apollo CSV)">
       <i class="fas fa-file-import text-amber-400"></i>
       <span>Import Contacts</span>
       <i id="crm-import-contacts-chevron" class="fas fa-chevron-down text-[10px] text-amber-300 transition-transform duration-200"></i>
      </button>
      <!-- Submenu Popup -->
      <div id="crm-import-contacts-submenu" class="hidden absolute right-0 mt-2 w-72 rounded-2xl bg-slate-950/98 border border-amber-400/60 shadow-[0_12px_35px_rgba(0,0,0,0.85)] z-[200] overflow-hidden backdrop-blur-xl">
       <div class="px-3.5 py-2 border-b border-slate-800 bg-slate-900/90 flex items-center justify-between">
        <span class="text-[10px] font-extrabold uppercase tracking-wider text-amber-300 flex items-center gap-1.5">
         <i class="fas fa-bolt"></i> Select Import Source
        </span>
        <span class="text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-200 font-mono">CRM Sync</span>
       </div>
       <div class="p-1.5 space-y-1.5">
        <!-- Option 1: Import Google Contacts -->
        <button type="button" id="btn-import-google-contacts" onclick="closeImportContactsSubmenu(); startGoogleContactsOAuthImport();" class="w-full text-left px-3 py-2.5 rounded-xl bg-red-500/10 hover:bg-red-500/25 border border-red-400/40 hover:border-red-300 transition-all flex items-center justify-between gap-2 group">
         <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-lg bg-red-500/20 border border-red-400/50 flex items-center justify-center text-red-400 shrink-0 group-hover:scale-105 transition-transform">
           <i class="fab fa-google text-xs"></i>
          </div>
          <div class="min-w-0">
           <div class="text-xs font-extrabold text-white group-hover:text-red-200 flex items-center gap-1.5">
            <span>Import Google Contacts</span>
           </div>
           <div class="text-[10px] text-slate-400 truncate">Sync via Google OAuth 2.0</div>
          </div>
         </div>
         <i class="fas fa-arrow-right text-[10px] text-red-300 group-hover:translate-x-0.5 transition-transform shrink-0"></i>
        </button>
        <!-- Option 2: via Apollo CSV -->
        <button type="button" id="btn-submenu-via-apollo-csv" onclick="openApolloCsvImportModal(event)" class="w-full text-left px-3 py-2.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/25 border border-amber-400/40 hover:border-amber-300 transition-all flex items-center justify-between gap-2 group">
         <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-400/50 flex items-center justify-center text-amber-300 shrink-0 group-hover:scale-105 transition-transform">
           <i class="fas fa-rocket text-xs"></i>
          </div>
          <div class="min-w-0">
           <div class="text-xs font-extrabold text-white group-hover:text-amber-200 flex items-center gap-1.5">
            <span>via Apollo CSV</span>
           </div>
           <div class="text-[10px] text-slate-400 truncate">Col E Company • Col F Email • Col T Phone</div>
          </div>
         </div>
         <i class="fas fa-arrow-right text-[10px] text-amber-300 group-hover:translate-x-0.5 transition-transform shrink-0"></i>
        </button>
       </div>
      </div>
     </div>
     <!-- Export CSV Button -->
     <button type="button" onclick="exportCrmContactsToCsv()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs font-semibold flex items-center gap-1.5 transition-all" title="Export CRM Contacts to Excel CSV">
      <i class="fas fa-file-csv text-emerald-400"></i>
      <span>Export CSV</span>
     </button>
     <!-- Sync CRM (Cloudinary + WhatsApp + Telegram + Auto-Combine Duplicates) Button -->
     <button type="button" onclick="syncAllCrmContactsWithDeduplication()" class="px-3 py-2 rounded-xl bg-gb-cyan/15 hover:bg-gb-cyan/25 border border-gb-cyan/50 text-gb-cyan text-xs font-bold flex items-center gap-1.5 transition-all" title="Sync Contacts from Cloudinary, WhatsApp & Telegram and Auto-Combine Duplicate Phone/Email">
      <i class="fas fa-sync-alt" id="crm-sync-icon"></i>
      <span>Sync &amp; Combine</span>
     </button>
     <!-- Top Trash Icon Button (Delete Selected or Delete All Contacts) -->
     <button type="button" id="btn-bulk-delete-crm-contacts" onclick="handleTopTrashDeleteCrmContacts()" class="px-3 py-2 rounded-xl bg-rose-950/60 hover:bg-rose-600 border border-rose-500/50 text-rose-300 hover:text-white text-xs font-bold flex items-center gap-1.5 transition-all shadow-[0_0_12px_rgba(244,63,94,0.18)]" title="Delete Selected / Delete All Contacts">
      <i class="fas fa-trash-alt"></i>
      <span id="crm-trash-btn-label" class="hidden sm:inline">Delete All</span>
     </button>
     <!-- + Create Contact Primary Button -->
     <button type="button" onclick="openCrmContactModal()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-400 to-gb-cyan text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-[0_0_15px_rgba(0,240,255,0.3)] hover:shadow-[0_0_22px_rgba(0,240,255,0.55)] transition-all">
      <i class="fas fa-user-plus"></i>
      <span>+ Create Contact</span>
     </button>
    </div>
   </div>
   <!-- CRM Summary KPI Strip -->
   <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-3.5 shrink-0">
    <div class="p-3 rounded-xl bg-slate-900/85 border border-slate-800 flex items-center justify-between">
     <div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Total Contacts</div>
      <div id="crm-stat-total" class="text-lg sm:text-xl font-extrabold text-white mt-0.5">0</div>
     </div>
     <div class="w-9 h-9 rounded-xl bg-gb-cyan/15 border border-gb-cyan/30 flex items-center justify-center text-gb-cyan">
      <i class="fas fa-users"></i>
     </div>
    </div>
    <div class="p-3 rounded-xl bg-slate-900/85 border border-slate-800 flex items-center justify-between">
     <div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">From Messages &amp; Comments</div>
      <div id="crm-stat-social" class="text-lg sm:text-xl font-extrabold text-pink-400 mt-0.5">0</div>
     </div>
     <div class="w-9 h-9 rounded-xl bg-pink-500/15 border border-pink-500/30 flex items-center justify-center text-pink-400">
      <i class="fas fa-comment-dots"></i>
     </div>
    </div>
    <div class="p-3 rounded-xl bg-slate-900/85 border border-slate-800 flex items-center justify-between">
     <div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">With Phone or Email</div>
      <div id="crm-stat-reachable" class="text-lg sm:text-xl font-extrabold text-amber-300 mt-0.5">0</div>
     </div>
     <div class="w-9 h-9 rounded-xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-300">
      <i class="fas fa-phone-alt"></i>
     </div>
    </div>
    <div class="p-3 rounded-xl bg-slate-900/85 border border-slate-800 flex items-center justify-between">
     <div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Active Clients &amp; VIPs</div>
      <div id="crm-stat-clients" class="text-lg sm:text-xl font-extrabold text-emerald-400 mt-0.5">0</div>
     </div>
     <div class="w-9 h-9 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
      <i class="fas fa-star"></i>
     </div>
    </div>
   </div>
   <!-- CRM Contacts Table Container -->
   <div id="crm-contacts-table-container" class="flex-1 min-h-[260px] overflow-auto rounded-2xl border border-slate-800 bg-slate-950/70">
    <!-- Populated dynamically by renderCrmContactsTable() -->
   </div>
  </div>
 </div>
