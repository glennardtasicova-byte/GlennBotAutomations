                                <span class="font-medium text-xs sm:text-sm">TikTok</span>

        <!-- Format & Live Preview Panel -->

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <label class="cursor-pointer"><input type="radio" name="post_type" value="text" class="peer sr-only" onchange="captureCurrentDraftState(); updatePreviews()"><div class="text-center py-2 px-2.5 rounded-lg border border-slate-700 bg-slate-800/50 font-medium text-xs sm:text-sm transition-all hover:bg-slate-700"><i class="fas fa-align-left mr-1"></i> Text Post</div></label>

                    <label class="cursor-pointer"><input type="radio" name="post_type" value="video169" class="peer sr-only" onchange="captureCurrentDraftState(); updatePreviews()"><div class="text-center py-2 px-2.5 rounded-lg border border-slate-700 bg-slate-800/50 font-medium text-xs sm:text-sm transition-all hover:bg-slate-700"><i class="fas fa-video mr-1"></i> 16:9 Video</div></label>
                    <label class="cursor-pointer"><input type="radio" name="post_type" value="image" class="peer sr-only" onchange="captureCurrentDraftState(); updatePreviews()"><div class="text-center py-2 px-2.5 rounded-lg border border-slate-700 bg-slate-800/50 font-medium text-xs sm:text-sm transition-all hover:bg-slate-700"><i class="fas fa-images mr-1"></i> Image/Album</div></label>

            </div>

            <!-- CLEAN LIVE PREVIEW LABEL + ASK AI ACTION BUTTON -->
            <div class="flex-none flex items-center justify-between mb-2 gap-2 flex-wrap">
                <h3 class="text-xs text-slate-400 uppercase tracking-widest font-semibold flex items-center gap-2">
                    <i class="fas fa-eye text-gb-cyan"></i> Live Preview
                </h3>
                <button type="button" onclick="openAskAiModal()"
                    onmouseenter="showActionBubble(event, 'Ask AI (Gemini 3.5 Flash)', 'Explain your content idea and let Gemini generate titles, captions, and descriptions automatically.', 'text-purple-400')"
                    onmousemove="movePostTooltip(event)" onmouseleave="hidePostTooltip()"
                    class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-purple-600 via-pink-600 to-gb-cyan text-white font-bold text-xs shadow-[0_0_15px_rgba(168,85,247,0.35)] hover:shadow-[0_0_20px_rgba(0,240,255,0.6)] flex items-center gap-1.5 transition-all transform hover:scale-105">

                    <span>Ask AI</span>
